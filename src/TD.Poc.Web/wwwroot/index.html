<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Workspace</title><link rel="stylesheet" href="/style.css"><script src="/app.js" type="module"></script></head><body>
<aside id="sidebar"><h1>Workspace</h1><button id="newChat" class="primary">＋ New chat</button><div class="sidebar-heading">Chats</div><nav id="chatList" aria-label="Saved chats"></nav><footer>Local workspace<span>Images stay in their chat</span></footer></aside>
<main><header><button id="menu" aria-label="Toggle chats">☰</button><h2 id="mode">Preparing workspace</h2><span id="ready" role="status">Connecting…</span></header>
<section id="messages" aria-live="polite"><div class="empty"><h2>Your workspace, ready to help.</h2><p>Start a chat to explore your sources.</p></div></section>
<section class="compose-region"><div id="job"><span id="progress">Ready</span><button id="stop" hidden>Stop</button><button id="toggleProgress">Activity</button></div><pre id="activity" hidden></pre><div id="attachments"></div><form id="composer"><label class="sr-only" for="question">Your question or command</label><textarea id="question" rows="2" placeholder="Ask a question or enter a command…" maxlength="12000"></textarea><div class="compose-actions"><label class="attach" for="file">⌕ Attach image</label><input id="file" type="file" accept="image/png,image/jpeg,image/webp" multiple hidden><span id="hint">Paste an image with Ctrl+V</span><button id="send" class="primary" type="submit">Send</button></div></form><p id="notice" role="status"></p></section>
</main><dialog id="sourceDialog"><div class="dialog-top"><h2 id="sourceTitle">Source</h2><button id="closeSource" aria-label="Close source">✕</button></div><p id="sourcePath"></p><div id="sourceContent"></div><div class="dialog-actions"><a id="downloadSource" target="_blank" rel="noopener">Open original file</a><a id="webSource" target="_blank" rel="noopener" hidden>Original website</a></div></dialog>
<dialog id="imageDialog"><button id="closeImage" aria-label="Close image">✕</button><img id="largeImage" alt="Source image"><p id="imageCaption"></p></dialog>
</body></html>
